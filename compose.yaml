services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger_api

    volumes:
      - postgres_data:/var/lib/postgresql

  web:
    build: .

    depends_on:
      - db

    env_file:
      - .env

    ports:
      - '${PORT}:${PORT}'

    restart: unless-stopped

    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

        - action: rebuild
          path: package.json

        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  postgres_data:
